<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 内容战略认知工作台</title><style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--line:#e6e8ef;--brand:#5b5bd6;--brand2:#ececff;--good:#16845b;--warn:#a56a00}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:#171a2b;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:18px;padding:8px 12px 28px}.brand small{display:block;color:#a9afd1;font-weight:400;font-size:12px;margin-top:7px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#c5cae8;padding:12px;border-radius:9px;margin:4px 0}.nav button.active,.nav button:hover{background:#30355b;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px 34px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:25px}.actions{display:flex;gap:9px}.btn{background:var(--brand);color:#fff;padding:10px 15px;border-radius:8px;font-weight:600}.btn.secondary{background:#fff;color:var(--brand);border:1px solid #cfd1fa}.btn.ghost{background:transparent;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.metric{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.section{margin-top:20px}.section h2{font-size:17px;margin:0 0 12px}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px}.row strong{display:block;margin-bottom:4px}.tag{display:inline-block;background:#f0f1ff;color:#4c4bb9;padding:4px 8px;border-radius:999px;font-size:12px;margin:3px 4px 0 0}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #ccd0df;border-radius:10px}.hidden{display:none}.form{display:grid;gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid #d8dbe6;border-radius:8px;background:#fff}.field textarea{min-height:100px;resize:vertical}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:220px;padding:10px;border:1px solid #d8dbe6;border-radius:8px}.pill{font-size:12px;padding:5px 8px;border-radius:6px;background:#f5f6fa;color:#5b6476}.report{display:grid;grid-template-columns:1fr 1fr;gap:13px}.report .field textarea{min-height:135px}.detail h3{margin:0 0 8px;font-size:15px}.notice{background:#fff9e8;color:#7d5b00;border:1px solid #f2dfaa;padding:12px;border-radius:9px;font-size:13px}.success{background:#eaf8f2;color:#16714f;padding:10px;border-radius:8px;font-size:13px}.danger{color:#b42318}.modal{position:fixed;inset:0;background:#11152b88;display:flex;align-items:center;justify-content:center;padding:20px}.modal>div{background:#fff;border-radius:14px;padding:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.close{float:right;background:transparent;font-size:20px;color:#777}@media(max-width:800px){.side{width:70px;padding:16px 8px}.brand{font-size:0}.brand small,.nav span{display:none}.nav button{text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.two,.report{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand">AI 内容战略<span>认知工作台</span><small>让每次分析沉淀为可复用知识</small></div><nav class="nav" id="nav"></nav></aside><main class="main" id="app"></main></div><div id="modal" class="modal hidden"></div><script>
const KEY='ai-content-workbench-v1';const uid=(p,n)=>p+'-'+String(n).padStart(4,'0');let db=JSON.parse(localStorage.getItem(KEY)||'null')||{cases:[],models:[],trainings:[],plans:[],experiments:[]};let page='home';let editing=null;const navItems=[['home','首页驾驶舱'],['cases','案例库'],['models','认知模型库'],['training','分析训练'],['plans','内容策划'],['experiments','实战验证']];
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function nextId(type,p){return uid(p,(db[type].length?Math.max(...db[type].map(x=>parseInt(x.id.split('-')[1])||0)):0)+1)}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tags(s=''){return s.split(/[,，、\s]+/).filter(Boolean).map(x=>'<span class="tag">'+esc(x)+'</span>').join('')}
function shell(title,actions=''){return `<div class="top"><h1>${title}</h1><div class="actions">${actions}</div></div>`}
function render(){document.querySelector('#nav').innerHTML=navItems.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${({home:'⌂',cases:'▣',models:'◇',training:'◌',plans:'✦',experiments:'↗'})[k]} <span>${v}</span></button>`).join('');let fn={home:home,cases:cases,models:models,training:training,plans:plans,experiments:experiments}[page];document.querySelector('#app').innerHTML=fn();}
function go(p){page=p;editing=null;render()}
function home(){let recent=db.cases.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,5);return shell('首页驾驶舱',`<button class="btn" onclick="newCase()">+ 新建案例分析</button><button class="btn secondary" onclick="exportData()">导出数据</button>`)+`<div class="grid"><div class="card"><div class="muted">案例总数</div><div class="metric">${db.cases.length}</div></div><div class="card"><div class="muted">认知模型</div><div class="metric">${db.models.length}</div></div><div class="card"><div class="muted">训练记录</div><div class="metric">${db.trainings.length}</div></div><div class="card"><div class="muted">内容策划</div><div class="metric">${db.plans.length}</div></div></div><div class="section"><h2>最近案例</h2><div class="list">${recent.length?recent.map(caseRow).join(''):'<div class="empty">还没有案例。先创建一个案例，开始沉淀知识。</div>'}</div></div><div class="section"><h2>数据与恢复</h2><div class="card"><p class="muted">数据保存在当前浏览器的 localStorage 中。清理站点数据、更换浏览器或设备可能影响访问，请定期导出 JSON 备份。</p><button class="btn secondary" onclick="document.querySelector('#importFile').click()">导入 JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></div>`}
function caseRow(c){return `<div class="row"><div><strong>${esc(c.title)}</strong><span class="muted">${c.id} · ${esc(c.platform||'未填写')} · ${new Date(c.updated).toLocaleDateString()}</span><div>${tags(c.tags)}</div></div><button class="btn secondary" onclick="viewCase('${c.id}')">查看</button></div>`}
function cases(){let q=window.caseQ||'';let arr=db.cases.filter(c=>(c.title+' '+c.content+' '+c.tags+' '+c.platform).toLowerCase().includes(q.toLowerCase()));return shell('案例库',`<button class="btn" onclick="newCase()">+ 新建案例</button>`)+`<div class="toolbar"><input placeholder="搜索标题、内容、平台、标签…" value="${esc(q)}" oninput="window.caseQ=this.value;render()"><button class="btn secondary" onclick="exportData()">导出</button></div><div class="list">${arr.length?arr.map(caseRow).join(''):'<div class="empty">没有匹配案例</div>'}</div>`}
function newCase(){editing={id:nextId('cases','CASE'),title:'',platform:'',url:'',content:'',background:'',format:'',likes:'',comments:'',favorites:'',shares:'',tags:'',layer1:'',layer2:'',layer3:'',layer4:'',facts:'',hypotheses:'',models:[],created:new Date().toISOString(),updated:new Date().toISOString()};page='caseForm';render()}
function viewCase(id){editing=db.cases.find(c=>c.id===id);page='caseDetail';render()}
function caseForm(){let c=editing;return shell(c.id?'编辑案例':'新建案例',`<button class="btn secondary" onclick="go('cases')">取消</button><button class="btn" onclick="saveCase()">保存案例</button>`)+`<div class="card form"><div class="two"><div class="field"><label>案例标题 *</label><input id="title" value="${esc(c.title)}"></div><div class="field"><label>来源平台</label><input id="platform" value="${esc(c.platform)}" placeholder="抖音 / 小红书 / B站…"></div></div><div class="two"><div class="field"><label>原始链接</label><input id="url" value="${esc(c.url)}"></div><div class="field"><label>内容形式</label><input id="format" value="${esc(c.format)}" placeholder="短视频 / 图文 / 直播…"></div></div><div class="field"><label>原始素材或文本 *</label><textarea id="content" placeholder="粘贴可读取的文本、字幕或内容摘要">${esc(c.content)}</textarea></div><div class="field"><label>背景信息</label><textarea id="background">${esc(c.background)}</textarea></div><div class="two"><div class="field"><label>点赞</label><input id="likes" value="${esc(c.likes)}"></div><div class="field"><label>评论</label><input id="comments" value="${esc(c.comments)}"></div><div class="field"><label>收藏</label><input id="favorites" value="${esc(c.favorites)}"></div><div class="field"><label>分享</label><input id="shares" value="${esc(c.shares)}"></div></div><div class="field"><label>标签（逗号分隔）</label><input id="tags" value="${esc(c.tags)}" placeholder="结果悬念, 自我投射"></div><h2>四层分析报告</h2><div class="report"><div class="field"><label>第一层｜表象分析</label><textarea id="layer1">${esc(c.layer1)}</textarea></div><div class="field"><label>第二层｜高手视角</label><textarea id="layer2">${esc(c.layer2)}</textarea></div><div class="field"><label>第三层｜底层机制</label><textarea id="layer3">${esc(c.layer3)}</textarea></div><div class="field"><label>第四层｜商业应用</label><textarea id="layer4">${esc(c.layer4)}</textarea></div></div><div class="two"><div class="field"><label>已观察事实</label><textarea id="facts"></textarea></div><div class="field"><label>待验证假设</label><textarea id="hypotheses">${esc(c.hypotheses)}</textarea></div></div><div class="notice">当前为本地 MVP。没有接入外部 AI API，因此分析报告由你手动填写；系统会保留事实、判断和待验证假设的字段边界。</div></div>`}
function collect(){let c=editing;['title','platform','url','format','content','background','likes','comments','favorites','shares','tags','layer1','layer2','layer3','layer4','facts','hypotheses'].forEach(k=>c[k]=document.querySelector('#'+k)?.value||'');c.updated=new Date().toISOString();return c}
function saveCase(){let c=collect();if(!c.title||!c.content){alert('请填写案例标题和原始素材或文本');return}let i=db.cases.findIndex(x=>x.id===c.id);if(i>=0)db.cases[i]=c;else db.cases.unshift(c);save();editing=c;page='caseDetail';render();}
function caseDetail(){let c=editing;return shell('案例详情',`<button class="btn secondary" onclick="go('cases')">返回案例库</button><button class="btn secondary" onclick="page='caseForm';render()">编辑</button><button class="btn" onclick="createModelFromCase('${c.id}')">提炼认知模型</button>`)+`<div class="card detail"><h2>${esc(c.title)}</h2><p class="muted">${c.id} · ${esc(c.platform||'未填写')} · ${esc(c.format||'未填写')} · 更新于 ${new Date(c.updated).toLocaleString()}</p><p>${tags(c.tags)}</p><div class="two"><div><h3>原始信息</h3><p>${esc(c.content).replace(/\n/g,'<br>')}</p><p class="muted">互动：点赞 ${esc(c.likes||'-')} · 评论 ${esc(c.comments||'-')} · 收藏 ${esc(c.favorites||'-')} · 分享 ${esc(c.shares||'-')}</p></div><div><h3>证据边界</h3><p><span class="pill">事实</span> ${esc(c.facts||'尚未填写')}</p><p><span class="pill">待验证假设</span> ${esc(c.hypotheses||'尚未填写')}</p></div></div><h3>四层分析</h3><div class="report">${[['第一层｜表象分析',c.layer1],['第二层｜高手视角',c.layer2],['第三层｜底层机制',c.layer3],['第四层｜商业应用',c.layer4]].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${esc(x[1]||'尚未填写').replace(/\n/g,'<br>')}</p></div>`).join('')}</div></div>`}
function models(){return shell('认知模型库',`<button class="btn" onclick="newModel()">+ 新建模型</button>`)+`<div class="list">${db.models.length?db.models.map(m=>`<div class="row"><div><strong>${esc(m.name)}</strong><span class="muted">${m.id} · ${esc(m.status)}</span><p>${esc(m.definition||'')}</p></div><button class="btn secondary" onclick="viewModel('${m.id}')">查看</button></div>`).join(''):'<div class="empty">尚未沉淀模型。可从案例详情中提炼候选模型。</div>'}</div>`}
function newModel(base=''){editing={id:nextId('models','MODEL'),name:base?'从案例提炼的候选机制':'',definition:'',mechanism:'',conditions:'',limits:'',status:'候选',caseIds:base?[base]:[],created:new Date().toISOString(),updated:new Date().toISOString()};page='modelForm';render()}
function createModelFromCase(id){newModel(id)}function viewModel(id){editing=db.models.find(m=>m.id===id);page='modelDetail';render()}
function modelForm(){let m=editing;return shell(m.id,`<button class="btn secondary" onclick="go('models')">取消</button><button class="btn" onclick="saveModel()">保存模型</button>`)+`<div class="card form"><div class="field"><label>模型名称 *</label><input id="mname" value="${esc(m.name)}"></div><div class="field"><label>核心定义</label><textarea id="mdef">${esc(m.definition)}</textarea></div><div class="field"><label>作用机制</label><textarea id="mmech">${esc(m.mechanism)}</textarea></div><div class="two"><div class="field"><label>适用条件</label><textarea id="mcond">${esc(m.conditions)}</textarea></div><div class="field"><label>反例或限制</label><textarea id="mlim">${esc(m.limits)}</textarea></div></div><div class="field"><label>验证状态</label><select id="mstatus">${['候选','待验证','有一定支持','已在特定场景验证','需要修正'].map(s=>`<option ${s===m.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`}
function saveModel(){let m=editing;m.name=document.querySelector('#mname').value;m.definition=document.querySelector('#mdef').value;m.mechanism=document.querySelector('#mmech').value;m.conditions=document.querySelector('#mcond').value;m.limits=document.querySelector('#mlim').value;m.status=document.querySelector('#mstatus').value;m.updated=new Date().toISOString();if(!m.name){alert('请填写模型名称');return}let i=db.models.findIndex(x=>x.id===m.id);if(i>=0)db.models[i]=m;else db.models.unshift(m);save();page='models';render()}
function modelDetail(){let m=editing;let linked=db.cases.filter(c=>m.caseIds?.includes(c.id));return shell('模型详情',`<button class="btn secondary" onclick="go('models')">返回</button><button class="btn secondary" onclick="page='modelForm';render()">编辑</button>`)+`<div class="card"><h2>${esc(m.name)}</h2><p><span class="pill">${esc(m.status)}</span> <span class="muted">${m.id}</span></p><h3>核心定义</h3><p>${esc(m.definition||'尚未填写')}</p><h3>作用机制</h3><p>${esc(m.mechanism||'尚未填写')}</p><h3>适用条件</h3><p>${esc(m.conditions||'尚未填写')}</p><h3>反例或限制</h3><p>${esc(m.limits||'尚未填写')}</p><h3>关联案例</h3>${linked.length?linked.map(c=>`<p><a href="#" onclick="viewCase('${c.id}');return false">${esc(c.id)} · ${esc(c.title)}</a></p>`).join(''):'<p class="muted">暂无</p>'}</div>`}
function training(){return shell('分析训练',`<button class="btn" onclick="newTraining()">+ 新建训练</button>`)+`<div class="notice">训练模块已提供真实记录入口；能力趋势会在积累足够记录后显示，避免用虚构数据替代评估。</div><div class="list" style="margin-top:14px">${db.trainings.length?db.trainings.map(t=>`<div class="row"><div><strong>${esc(t.title)}</strong><span class="muted">${t.id} · ${new Date(t.created).toLocaleDateString()}</span></div></div>`).join(''):'<div class="empty">暂无训练记录</div>'}</div>`}
function newTraining(){let title=prompt('训练标题');if(!title)return;db.trainings.unshift({id:nextId('trainings','TRAIN'),title,created:new Date().toISOString()});save();render()}
function plans(){return shell('内容策划',`<button class="btn" onclick="newPlan()">+ 新建策划</button>`)+`<div class="notice">策划可先记录业务背景与待验证假设，再回到案例库调用已有依据。</div><div class="list" style="margin-top:14px">${db.plans.length?db.plans.map(p=>`<div class="row"><div><strong>${esc(p.title)}</strong><span class="muted">${p.id} · ${new Date(p.created).toLocaleDateString()}</span></div></div>`).join(''):'<div class="empty">暂无内容策划</div>'}</div>`}
function newPlan(){let title=prompt('策划标题');if(!title)return;db.plans.unshift({id:nextId('plans','PLAN'),title,created:new Date().toISOString()});save();render()}
function experiments(){return shell('实战验证',`<button class="btn" onclick="newExperiment()">+ 新建验证</button>`)+`<div class="notice">第一阶段支持手动记录验证条目；平台指标口径由你在记录中说明，不做跨平台自动比较。</div><div class="list" style="margin-top:14px">${db.experiments.length?db.experiments.map(e=>`<div class="row"><div><strong>${esc(e.title)}</strong><span class="muted">${e.id} · ${new Date(e.created).toLocaleDateString()}</span></div></div>`).join(''):'<div class="empty">暂无实战验证</div>'}</div>`}
function newExperiment(){let title=prompt('验证标题');if(!title)return;db.experiments.unshift({id:nextId('experiments','EXP'),title,created:new Date().toISOString()});save();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ai-content-workbench-backup.json';a.click();}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.cases||!x.models)throw Error();db=x;save();render();alert('导入成功');}catch{alert('导入失败：JSON 结构不正确')}};r.readAsText(f)}
if(!db.cases.length){db.cases.push({id:'CASE-0001',title:'冻了这么多的土豆，可以让我瘦10斤吗？',platform:'短视频',url:'',format:'个人减肥挑战',content:'个人挑战：用冻土豆进行减重，目标是瘦10斤。',background:'验收示例案例；当前只根据已提供文字和互动数据分析。',likes:'766',comments:'1630',favorites:'173',shares:'338',tags:'结果悬念, 自我投射, 低门槛行动, 经验分享',layer1:'事实：个人减肥挑战，目标明确；评论数高于点赞数，说明互动讨论值得进一步核验。',layer2:'可能的用户需求：围绕“我能否做到”的自我投射，以及对结果的好奇。这里属于基于内容结构的推断。',layer3:'待验证机制：结果悬念、低门槛行动与高价值目标之间的张力，可能促使用户继续观看并评论。仅凭单条案例不能确认因果。',layer4:'可迁移方向：将手作材料包设计为低门槛挑战，设置清晰结果和过程记录；需通过不同选题的完播、评论和转化数据验证。',facts:'已知：标题、内容形式、互动数据。未提供完整视频、发布时间、粉丝基数和平台分发信息。',hypotheses:'结果悬念；自我投射；低门槛行动与高价值目标；经验分享与观点表达。',models:[],created:new Date().toISOString(),updated:new Date().toISOString()});save()}
render();
</script></body></html>
